name: GREEON
options:
  bundleIdPrefix: com.sankang
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  GREEON:
    type: application
    platform: iOS
    sources:
      - path: GREEON
        excludes:
          - "**/.keep"
          - "Info.plist"
    # xcodegen generate가 project.pbxproj를 매번 새로 쓰기 때문에, Xcode UI에서만
    # 지정한 Team은 재생성될 때마다 풀린다 — attributes로 명시해 소스에 고정
    attributes:
      DevelopmentTeam: 6986L7M4P4
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sankang.GREEON
        DEVELOPMENT_TEAM: 6986L7M4P4
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: GREEON/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
